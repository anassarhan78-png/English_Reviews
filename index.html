<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 منصة المراجعة الذكية | Smart Review</title>
    <!-- مكتبة الصوت الاحترافية ResponsiveVoice -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=VnGx3fGq"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e5a3a, #0f2a1c);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .toolbar {
            background: linear-gradient(135deg, #2b7a4b, #1e5a3a);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 10px;
        }
        .toolbar button {
            background: white;
            color: #2b7a4b;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .course-tabs, .unit-tabs {
            display: flex;
            background: #eaf7ed;
            border-bottom: 2px solid #b8d9c2;
            overflow-x: auto;
        }
        .course-tab, .unit-tab {
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            background: #eaf7ed;
            color: #1e5a3a;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }
        .course-tab.active, .unit-tab.active {
            background: white;
            border-bottom-color: #2b7a4b;
            color: #2b7a4b;
        }
        .sub-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }
        .sub-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            background: #f8f9fa;
            color: #2c3e6d;
            font-weight: bold;
        }
        .sub-tab.active {
            background: white;
            border-bottom: 3px solid #2b7a4b;
            color: #2b7a4b;
        }
        .content { padding: 25px; }
        h2 { color: #1e5a3a; margin-bottom: 15px; }
        
        /* شريط التقدم */
        .progress-area { margin-bottom: 20px; }

        /* السؤال والخيارات */
        .question {
            background: #fef5e8;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            direction: ltr;
            text-align: left;
            position: relative;
        }
        .question .audio-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #2b7a4b;
            transition: transform 0.2s ease;
        }
        .question .audio-btn:hover { transform: scale(1.2); color: #ff8c42; }

        .option {
            background: #f8f9fa;
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 40px;
            cursor: pointer;
            border: 1px solid #ddd;
            direction: ltr;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option:hover { background: #e9ecef; border-color: #2b7a4b; }
        .option.selected { background: #2b7a4b; color: white; font-weight: bold; }
        
        .feedback { margin: 15px 0; padding: 12px; border-radius: 16px; }
        .feedback.correct { background: #d4edda; color: #155724; }
        .feedback.wrong { background: #f8d7da; color: #721c24; direction: ltr; text-align: left; }
        
        button {
            background: #2b7a4b;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        .nav-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        
        /* شاشة النتيجة */
        .result-screen {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 25px;
        }
        .result-screen .emoji { font-size: 48px; }
        .result-screen .percent { font-size: 36px; font-weight: bold; color: #2b7a4b; }
        .result-screen .msg { font-size: 18px; margin: 15px 0; }
        .wrong-list { text-align: right; margin-top: 20px; }

        .writing-box, .grammar-box { background: #fef9e6; padding: 20px; border-radius: 24px; }
        footer { text-align: center; margin-top: 20px; font-size: 0.75rem; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="toolbar">
        <span><i class="fas fa-graduation-cap"></i> نظام المراجعات</span>
        <div>
            <button id="reset-cycle-btn" style="display:none;"><i class="fas fa-sync-alt"></i> بدء دورة جديدة</button>
            <button id="print-pdf"><i class="fas fa-print"></i> طباعة تفاعلية</button>
            <button id="print-exam"><i class="fas fa-file-pdf"></i> طباعة الأسئلة (نسخة ورقية)</button>
        </div>
    </div>
    <div class="course-tabs" id="courseTabs"></div>
    <div class="unit-tabs" id="unitTabs"></div>
    <div class="sub-tabs" id="subTabs"></div>
    <div class="content">
        <h2 id="modeTitle"></h2>
        <div id="quiz-container"></div>
        <div class="nav-buttons">
            <button id="prev-btn" style="display:none;"><i class="fas fa-arrow-right"></i> السابق</button>
            <button id="submit-btn" style="display:none;">إرسال الإجابة ✅</button>
            <button id="next-btn" style="display:none;">التالي <i class="fas fa-arrow-left"></i></button>
        </div>
    </div>
</div>

<script>
    let config = { courses: [] };
    let currentCourse = null;
    let currentUnit = null;
    let currentSubMode = 'full';
    let questions = [];
    let wrongQuestions = []; // لتخزين الأسئلة الخاطئة
    let currentIndex = 0, selectedAnswer = null, score = 0;
    let isReviewMode = false; // هل نحن في وضع مراجعة الأخطاء؟

    async function loadConfig() {
        const res = await fetch('config.json');
        config = await res.json();
        renderCourseTabs();
        if (config.courses.length) loadCourse(config.courses[0]);
    }

    function renderCourseTabs() {
        const container = document.getElementById('courseTabs');
        container.innerHTML = '';
        config.courses.forEach((course, idx) => {
            const tab = document.createElement('div');
            tab.className = 'course-tab';
            if (idx === 0) tab.classList.add('active');
            tab.innerText = course.title;
            tab.onclick = () => {
                document.querySelectorAll('.course-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                loadCourse(course);
            };
            container.appendChild(tab);
        });
    }

    function loadCourse(course) {
        currentCourse = course;
        renderUnitTabs();
        if (course.units.length) loadUnit(course.units[0]);
    }

    function renderUnitTabs() {
        const container = document.getElementById('unitTabs');
        container.innerHTML = '';
        currentCourse.units.forEach((unit, idx) => {
            const tab = document.createElement('div');
            tab.className = 'unit-tab';
            if (idx === 0) tab.classList.add('active');
            tab.innerText = `الوحدة ${unit.replace('unit', '')}`;
            tab.onclick = () => {
                document.querySelectorAll('.unit-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                loadUnit(unit);
            };
            container.appendChild(tab);
        });
    }

    function loadUnit(unit) {
        currentUnit = unit;
        currentSubMode = 'full';
        renderSubTabs();
        loadSubMode();
    }

    function renderSubTabs() {
        const container = document.getElementById('subTabs');
        container.innerHTML = `
            <div class="sub-tab" data-mode="full">📚 شامل</div>
            <div class="sub-tab" data-mode="vocab">📖 مفردات</div>
            <div class="sub-tab" data-mode="writing">✍️ كتابة</div>
            <div class="sub-tab" data-mode="grammar">📘 قواعد</div>
        `;
        document.querySelectorAll('.sub-tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentSubMode = tab.getAttribute('data-mode');
                loadSubMode();
            };
        });
        document.querySelector('.sub-tab[data-mode="full"]').classList.add('active');
    }

    async function loadSubMode() {
        if (currentSubMode === 'writing') { await loadWritingSection(); return; }
        if (currentSubMode === 'grammar') { await loadGrammarSection(); return; }
        const fileName = (currentSubMode === 'full') ? 'questions.json' : 'vocabulary.json';
        const filePath = `units/${currentCourse.id}/${currentUnit}/${fileName}`;
        try {
            const res = await fetch(filePath);
            if (!res.ok) throw new Error(`الملف غير موجود`);
            questions = await res.json();
            startNewCycle();
        } catch(err) {
            document.getElementById('quiz-container').innerHTML = `<div style="color:red;">⚠️ ${err.message}</div>`;
        }
    }

    function startNewCycle() {
        currentIndex = 0;
        score = 0;
        wrongQuestions = [];
        isReviewMode = false;
        renderQuizInterface();
        showQuestion();
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('reset-cycle-btn').style.display = 'none';
    }

    function renderQuizInterface() {
        const title = document.getElementById('modeTitle');
        title.innerHTML = `${currentCourse.title} – الوحدة ${currentUnit.replace('unit', '')} – ${currentSubMode === 'full' ? 'اختبار شامل' : 'مفردات'}`;
        if (isReviewMode) title.innerHTML += ' (دورة تصحيح الأخطاء)';
        document.getElementById('quiz-container').innerHTML = '<div id="quiz-area"></div><div id="feedback"></div>';
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('prev-btn').style.display = 'none';
    }

    function showQuestion() {
        const q = questions[currentIndex];
        const container = document.getElementById('quiz-area');
        
        // استخراج كلمة إنجليزية للنطق (أول 3 كلمات)
        let wordToRead = q.text.split(' ').slice(0, 3).join(' ');
        wordToRead = wordToRead.replace(/[^a-zA-Z0-9 ]/g, '');

        let html = `<div class="question">
            ${q.text}
            <button class="audio-btn" onclick="event.stopPropagation(); speakWord('${wordToRead}')" title="استمع للنطق">🔊</button>
        </div>`;
        
        const letters = ['A','B','C','D'];
        q.options.forEach((opt,i) => {
            html += `<div class="option" data-letter="${letters[i]}">${letters[i]}. ${opt}</div>`;
        });
        container.innerHTML = html;
        attachOptionEvents();
        updateProgress();
        updateNavButtons();
    }

    function attachOptionEvents() {
        document.querySelectorAll('.option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedAnswer = opt.getAttribute('data-letter');
            };
        });
    }

    // دالة تشغيل الصوت باستخدام ResponsiveVoice
    function speakWord(text) {
        if (text && window.responsiveVoice) {
            responsiveVoice.speak(text, "UK English Female", {rate: 0.9, pitch: 1.1});
        } else if (text && window.speechSynthesis) {
            // احتياطي في حال فشل تحميل المكتبة
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            speechSynthesis.speak(utterance);
        }
    }

    function updateProgress() {
        const percent = ((currentIndex) / questions.length) * 100;
        const progressHtml = `<div style="display:flex; justify-content:space-between;"><span>السؤال ${currentIndex+1} / ${questions.length}</span><span>⭐ النقاط: ${score}</span></div><div style="background:#ddd; border-radius:20px; height:8px;"><div style="background:#2b7a4b; width:${percent}%; height:8px;"></div></div>`;
        const existing = document.querySelector('.progress-area');
        if (existing) existing.remove();
        const div = document.createElement('div');
        div.className = 'progress-area';
        div.innerHTML = progressHtml;
        document.getElementById('quiz-container').insertBefore(div, document.getElementById('quiz-area'));
    }

    function updateNavButtons() {
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        
        if (currentIndex > 0) prevBtn.style.display = 'inline-block';
        else prevBtn.style.display = 'none';
        
        if (currentIndex < questions.length - 1) {
            nextBtn.style.display = 'inline-block';
            nextBtn.innerHTML = 'التالي <i class="fas fa-arrow-left"></i>';
        } else {
            nextBtn.innerHTML = 'إنهاء الاختبار 🏁';
            nextBtn.style.display = 'inline-block';
        }
    }

    document.getElementById('submit-btn').onclick = () => {
        if (!selectedAnswer) { alert('اختر إجابة'); return; }
        const q = questions[currentIndex];
        const isCorrect = (selectedAnswer === q.correct);
        const fb = document.getElementById('feedback');
        
        if (isCorrect) {
            score++;
            fb.innerHTML = `<div class="feedback correct">✅ صحيح! ${q.explanation[selectedAnswer]}</div>`;
        } else {
            // إضافة السؤال الخاطئ إلى القائمة للمراجعة لاحقاً
            wrongQuestions.push(q);
            fb.innerHTML = `<div class="feedback wrong">❌ خطأ. الإجابة: ${q.correct}<br>${q.explanation[selectedAnswer]}<br>${q.explanation[q.correct] ? '✅ الصحيح: ' + q.explanation[q.correct] : ''}</div>`;
        }
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'inline-block';
        updateProgress();
    };

    document.getElementById('next-btn').onclick = () => {
        if (currentIndex === questions.length - 1) {
            finishQuiz();
        } else {
            currentIndex++;
            showQuestion();
            document.getElementById('submit-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback').innerHTML = '';
            selectedAnswer = null;
            updateProgress();
        }
    };

    document.getElementById('prev-btn').onclick = () => {
        currentIndex--;
        showQuestion();
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback').innerHTML = '';
        selectedAnswer = null;
        updateProgress();
    };

    function finishQuiz() {
        const total = questions.length;
        const percent = Math.round((score / total) * 100);
        
        // تنظيف الواجهة
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('prev-btn').style.display = 'none';
        
        let msg = '';
        let emoji = '';
        if (percent >= 90) { msg = 'ممتاز! 🌟 أنت في مستوى متقدم (Advanced)'; emoji = '🏆'; }
        else if (percent >= 70) { msg = 'جيد جداً! 👍 واصل التقدم'; emoji = '😊'; }
        else { msg = 'حاول مرة أخرى! 💪 لا تيأس، التعلم بالتكرار'; emoji = '📚'; }

        let html = `
            <div class="result-screen">
                <div class="emoji">${emoji}</div>
                <div class="percent">${percent}%</div>
                <div class="msg">${msg}</div>
                <p>✅ إجابات صحيحة: <strong>${score}</strong> من ${total}</p>
                <p>❌ إجابات خاطئة: <strong>${wrongQuestions.length}</strong></p>
        `;

        if (wrongQuestions.length > 0) {
            html += `<div class="wrong-list"><h3>📌 الأسئلة التي تحتاج مراجعة:</h3><ol>`;
            wrongQuestions.forEach(q => {
                html += `<li style="direction:ltr; text-align:left;">${q.text} (الإجابة: ${q.correct})</li>`;
            });
            html += `</ol>
                <button onclick="startReviewCycle()" style="margin-top:15px; background:#ff8c42;">
                    <i class="fas fa-sync-alt"></i> إعادة الأسئلة الخاطئة الآن
                </button>`;
        }
        html += `</div>`;
        
        document.getElementById('quiz-container').innerHTML = html;
        document.getElementById('reset-cycle-btn').style.display = 'inline-block';
    }

    // بدء دورة مراجعة الأخطاء
    window.startReviewCycle = function() {
        if (wrongQuestions.length === 0) {
            alert("لا توجد أخطاء لمراجعتها! 👏");
            return;
        }
        questions = [...wrongQuestions];
        isReviewMode = true;
        currentIndex = 0;
        score = 0;
        wrongQuestions = [];
        renderQuizInterface();
        showQuestion();
        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('reset-cycle-btn').style.display = 'none';
    };

    document.getElementById('reset-cycle-btn').onclick = () => {
        loadSubMode(); // إعادة تحميل الأسئلة من البداية
    };

    // بقية الدوال (writing, grammar, printing) بدون تغيير
    async function loadWritingSection() {
        const filePath = `units/${currentCourse.id}/${currentUnit}/writing.json`;
        let data = {};
        try {
            const res = await fetch(filePath);
            if (res.ok) data = await res.json();
        } catch(e) {}
        const html = `<div class="writing-box"><h3>📝 ${data.title || 'موضوع الكتابة'}</h3><p>${data.prompts ? data.prompts.join('<br>') : 'اكتب موضوعك هنا.'}</p><textarea rows="6" style="width:100%; margin:15px 0; padding:10px;"></textarea><button id="save-writing">💾 حفظ</button><div id="writing-feedback"></div></div>`;
        document.getElementById('quiz-container').innerHTML = html;
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('prev-btn').style.display = 'none';
        document.getElementById('save-writing').onclick = () => alert('تم حفظ مسودتك (محلياً)');
    }

    async function loadGrammarSection() {
        const filePath = `units/${currentCourse.id}/${currentUnit}/grammar.json`;
        let data = {};
        try {
            const res = await fetch(filePath);
            if (res.ok) data = await res.json();
        } catch(e) {}
        let html = `<div class="grammar-box"><h2>${data.title || 'شرح القواعد'}</h2>`;
        if (data.topics) {
            data.topics.forEach(t => {
                html += `<h3>${t.name}</h3><p>${t.rule}</p>`;
                if (t.examples) html += `<ul>${t.examples.map(ex => `<li>${ex}</li>`).join('')}</ul>`;
            });
        }
        html += `</div>`;
        document.getElementById('quiz-container').innerHTML = html;
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('prev-btn').style.display = 'none';
    }

    document.getElementById('print-pdf').addEventListener('click', () => window.print());
    document.getElementById('print-exam').addEventListener('click', async () => {
        const filePath = `units/${currentCourse.id}/${currentUnit}/questions.json`;
        let examQuestions = [];
        try {
            const res = await fetch(filePath);
            if (res.ok) examQuestions = await res.json();
        } catch(e) { alert('لا توجد أسئلة للطباعة'); return; }
        if (!examQuestions.length) { alert('لا توجد أسئلة'); return; }
        const win = window.open('', '_blank');
        win.document.write(`
            <!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>امتحان</title><style>body{padding:1.5cm;}</style></head>
            <body><h1>${currentCourse.title} – الوحدة ${currentUnit.replace('unit', '')}</h1><div>الاسم: _______________</div><hr>
            ${examQuestions.map((q,i)=>`<div><b>${i+1}. ${q.text}</b><br>${q.options.map((o,j)=>`<div>${String.fromCharCode(65+j)}. ${o}</div>`).join('')}<div>الإجابة: ___________</div><hr></div>`).join('')}
            </body></html>
        `);
        win.document.close();
        win.print();
    });

    loadConfig();
</script>
</body>
</html>
